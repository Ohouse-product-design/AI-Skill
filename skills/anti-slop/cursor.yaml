description: "LifeService UXUI 지식 위키(45페이지)를 LLM Wiki 패턴으로 유지·조회하는 스킬. \"이 문서 위키에 넣어줘\", \"위키 린트 돌려줘\", \"정본이랑 캐시 어긋난 거 있어?\", \"이 답 위키에 남겨줘\", \"위키에서 찾아줘\" 등의 표현에 반응. 새 소스를 위키에 녹이고(ingest), 위키 기반으로 답하고 좋은 답을 되적재하고(query), 모순·stale·고아·드리프트를 검진한다(lint). 지면·컴포넌트를 새로 만드는 요청은 이 스킬이 아니다."
alwaysApply: false
